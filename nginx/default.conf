server {
  listen 80;

  # Docker's internal DNS, so Nginx can start even if backend is not running yet
  resolver 127.0.0.11 valid=10s;

  # Answered by Nginx itself, to test that Nginx works
  location = /nginx-health {
    return 200 "ok\n";
  }

  # /api and /health go to Express
  location ~ ^/(api|health) {
    set $backend http://admanager-backend:4040;
    proxy_pass $backend;
    # Ad images can be up to 5 MB (nginx allows only 1 MB by default)
    client_max_body_size 6m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Everything else goes to React (Vite)
  location / {
    set $frontend http://admanager-frontend:5173;
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}