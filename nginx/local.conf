# Nginx config for running WITHOUT Docker (backend and frontend run on your computer).
# Open http://localhost:8088 -> nginx sends /api to the backend and everything else to React.
# (nginx/default.conf is the Docker version.)

server {
  listen 8088;

  # Answered by nginx itself, to test that nginx works: http://localhost:8088/nginx-health
  location = /nginx-health {
    return 200 "ok\n";
  }

  # /api and /health go to Express (backend)
  location ~ ^/(api|health) {
    proxy_pass http://localhost:4040;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Allow image uploads up to 5 MB (same limit as the backend)
    client_max_body_size 5m;
  }

  # Everything else goes to React (Vite dev server)
  location / {
    proxy_pass http://localhost:5173;
    # These 3 lines keep Vite's live reload (websocket) working
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
