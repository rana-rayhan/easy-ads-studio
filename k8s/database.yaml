# PostgreSQL, Redis and RabbitMQ: the things the backend needs to start.
# Each one is a Deployment (runs the pod) plus a Service (gives it a fixed name inside the cluster).
# PostgreSQL saves its data in /data/admanager-db on the minikube machine, so users are kept.
# Redis and RabbitMQ keep nothing, so after a restart you need to log in again.

# ---------- PostgreSQL ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admanager-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admanager-db
  template:
    metadata:
      labels:
        app: admanager-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: admanager_db
          ports:
            - containerPort: 5432
          # The database files are kept here, so users survive a pod restart
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: db-data
          hostPath:
            path: /data/admanager-db
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: admanager-db # other pods reach it at admanager-db:5432
spec:
  selector:
    app: admanager-db
  ports:
    - port: 5432

# ---------- Redis ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admanager-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admanager-redis
  template:
    metadata:
      labels:
        app: admanager-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: admanager-redis # admanager-redis:6379
spec:
  selector:
    app: admanager-redis
  ports:
    - port: 6379

# ---------- RabbitMQ ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admanager-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admanager-rabbitmq
  template:
    metadata:
      labels:
        app: admanager-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: admanager-rabbitmq # admanager-rabbitmq:5672 (default user guest / guest)
spec:
  selector:
    app: admanager-rabbitmq
  ports:
    - port: 5672
